<?xml version="1.0" encoding="UTF-8"?>
<!--
  MolTrace mark, flat.

  Same geometry as moltrace-mark.svg — identical hexagon, facet lines, satellite
  hexagons and "m" position — with the dimensional treatment removed: no bloom,
  no glow filter, no cast shadow, no face gradients. Where the 3D mark shades
  three faces to imply a solid, this leaves the interior one flat navy and lets
  the cyan linework carry the shape.

  It exists because a raster of the 3D mark is the wrong thing to put on a social
  card: chat clients scale the card down hard, and glow plus bevel plus a
  gradient "m" turn to mush at thumbnail size, while flat strokes stay crisp.

  No <filter> and no <mask>: Satori (next/og) supports neither reliably, so the
  "m" is drawn as plain text over the linework rather than knocked out of it.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="moltrace-mark-flat-title">
  <title id="moltrace-mark-flat-title">MolTrace logo</title>
  <defs>
    <clipPath id="mtf-hex" clipPathUnits="userSpaceOnUse">
      <polygon points="17.75,3.5 46.25,3.5 60.5,32 46.25,60.5 17.75,60.5 3.5,32"/>
    </clipPath>
  </defs>

  <!-- Interior: one flat fill, not three shaded faces. -->
  <g clip-path="url(#mtf-hex)">
    <rect width="64" height="64" fill="#0A2540"/>

    <!-- The three facet lines that radiate from the centre. -->
    <g stroke="#26C6FF" stroke-width="1.3" stroke-linecap="round" fill="none">
      <line x1="32" y1="32" x2="48" y2="0"/>
      <line x1="32" y1="32" x2="48" y2="64"/>
      <line x1="32" y1="32" x2="0" y2="32"/>
    </g>

    <!-- Satellite hexagons, sheared exactly as in the dimensional mark so the
         two read as the same drawing. -->
    <g stroke="#26C6FF" stroke-width="1.1" stroke-linejoin="miter" fill="none">
      <g transform="translate(24 14) matrix(1 0 -0.5 1 0 0) translate(-24 -14)">
        <polygon points="27.464,16.000 24.000,18.000 20.536,16.000 20.536,12.000 24.000,10.000 27.464,12.000"/>
      </g>
      <g transform="translate(52 23) matrix(0.5 1 -0.5 1 0 0) translate(-52 -23)">
        <polygon points="55.464,25.000 52.000,27.000 48.536,25.000 48.536,21.000 52.000,19.000 55.464,21.000"/>
      </g>
      <g transform="translate(27 53) matrix(1 0 0.5 1 0 0) translate(-27 -53)">
        <polygon points="30.464,55.000 27.000,57.000 23.536,55.000 23.536,51.000 27.000,49.000 30.464,51.000"/>
      </g>
    </g>
  </g>

  <!-- Hexagon border: a single flat stroke, where the dimensional mark stacks
       three of different widths and opacities to fake depth. -->
  <polygon points="17.75,3.5 46.25,3.5 60.5,32 46.25,60.5 17.75,60.5 3.5,32"
    fill="none" stroke="#26C6FF" stroke-width="2.6" stroke-linejoin="miter"/>

  <!-- Flat white, no gradient and no drop shadow. -->
  <text x="32" y="32" dy="0.33em" fill="#FFFFFF"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="34" font-weight="900" text-anchor="middle"
    text-rendering="geometricPrecision">m</text>
</svg>
