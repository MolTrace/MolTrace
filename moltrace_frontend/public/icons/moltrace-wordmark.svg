<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" fill="none" role="img" aria-labelledby="moltrace-wordmark-title">
  <title id="moltrace-wordmark-title">MolTrace</title>
  <g transform="translate(8 8)">
    <svg x="0" y="0" width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <clipPath id="moltrace-wordmark-mark-hex" clipPathUnits="userSpaceOnUse">
      <polygon points="17.75,3.5 46.25,3.5 60.5,32 46.25,60.5 17.75,60.5 3.5,32"/>
    </clipPath>
    <mask id="moltrace-mark-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <text x="32" y="32" dy="0.33em"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="34" font-weight="900" text-anchor="middle"
        text-rendering="geometricPrecision" fill="#000" stroke="#000" stroke-width="1.5">m</text>
    </mask>
    <filter id="moltrace-mark-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="blur"/>
      <feFlood flood-color="#26C6FF" flood-opacity="0.85" result="flood"/>
      <feComposite in="flood" in2="blur" operator="in" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="moltrace-mark-bloom" x="-75%" y="-75%" width="250%" height="250%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="wide"/>
      <feFlood flood-color="#26C6FF" flood-opacity="0.9" result="flood"/>
      <feComposite in="flood" in2="wide" operator="in" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
      </feMerge>
    </filter>
    <filter id="moltrace-mark-cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0.9" dy="1.3" stdDeviation="0.9" flood-color="#020C17" flood-opacity="0.85"/>
    </filter>
    <linearGradient id="moltrace-mark-mface" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B9D8EC"/>
    </linearGradient>
    <linearGradient id="moltrace-mark-topface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14425F"/>
      <stop offset="100%" stop-color="#0A2A45"/>
    </linearGradient>
    <linearGradient id="moltrace-mark-rightface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F3552"/>
      <stop offset="100%" stop-color="#061C2E"/>
    </linearGradient>
    <linearGradient id="moltrace-mark-leftface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2438"/>
      <stop offset="100%" stop-color="#03101E"/>
    </linearGradient>
  </defs>
  <polygon points="17.75,3.5 46.25,3.5 60.5,32 46.25,60.5 17.75,60.5 3.5,32" fill="none" stroke="#26C6FF" stroke-width="2.4" stroke-linejoin="miter" filter="url(#moltrace-mark-bloom)" opacity="0.75"/>
  <g clip-path="url(#moltrace-wordmark-mark-hex)">
    <rect width="64" height="64" fill="#051f3a"/>
    <g mask="url(#moltrace-mark-cutout)">
      <polygon points="16,0 48,0 32,32 0,32" fill="url(#moltrace-mark-topface)"/>
      <polygon points="48,0 64,32 48,64 32,32" fill="url(#moltrace-mark-rightface)"/>
      <polygon points="32,32 48,64 16,64 0,32" fill="url(#moltrace-mark-leftface)"/>
    </g>
    <g mask="url(#moltrace-mark-cutout)" filter="url(#moltrace-mark-glow)" stroke-width="1.1" stroke-linejoin="miter" stroke-linecap="butt" fill="none">
      <g transform="translate(24 14) matrix(1 0 -0.5 1 0 0) translate(-24 -14)">
        <polygon points="27.464,16.000 24.000,18.000 20.536,16.000 20.536,12.000 24.000,10.000 27.464,12.000" stroke="#26C6FF"/>
      </g>
      <g transform="translate(52 23) matrix(0.5 1 -0.5 1 0 0) translate(-52 -23)">
        <polygon points="55.464,25.000 52.000,27.000 48.536,25.000 48.536,21.000 52.000,19.000 55.464,21.000" stroke="#26C6FF"/>
      </g>
      <g transform="translate(27 53) matrix(1 0 0.5 1 0 0) translate(-27 -53)">
        <polygon points="30.464,55.000 27.000,57.000 23.536,55.000 23.536,51.000 27.000,49.000 30.464,51.000" stroke="#26C6FF"/>
      </g>
    </g>
    <g mask="url(#moltrace-mark-cutout)" filter="url(#moltrace-mark-glow)" stroke="#26C6FF" stroke-width="1.3" stroke-linecap="round" fill="none">
      <line x1="32" y1="32" x2="48" y2="0"/>
      <line x1="32" y1="32" x2="48" y2="64"/>
      <line x1="32" y1="32" x2="0" y2="32"/>
    </g>
  </g>
  <polygon points="17.175,2.3500000000000014 46.825,2.3500000000000014 61.65,32 46.825,61.65 17.175,61.65 2.3500000000000014,32" fill="none" stroke="#7FD8FF" stroke-width="0.7" stroke-linejoin="miter" opacity="0.4"/>
  <polygon points="17.75,3.5 46.25,3.5 60.5,32 46.25,60.5 17.75,60.5 3.5,32" fill="none" stroke="#26C6FF" stroke-width="2.3" stroke-linejoin="miter"/>
  <polygon points="17.75,3.5 46.25,3.5 60.5,32 46.25,60.5 17.75,60.5 3.5,32" fill="none" stroke="#CDF0FF" stroke-width="0.85" stroke-linejoin="miter" opacity="0.9"/>
  <g
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="34"
    font-weight="900"
    text-anchor="middle"
    text-rendering="geometricPrecision"
  >
    <text x="32" y="32" dy="0.33em" fill="url(#moltrace-mark-mface)" filter="url(#moltrace-mark-cast)">m</text>
    <text x="32" y="32" dy="0.33em" fill="none" stroke="#8FDCFF" stroke-width="0.9" stroke-linejoin="round" opacity="0.95">m</text>
  </g>
</svg>
  </g>
  <text
    x="88"
    y="49"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="0"
    text-rendering="geometricPrecision"
  ><tspan fill="#111827">Mol</tspan><tspan fill="#26C6FF" font-weight="800">Trace</tspan></text>
</svg>