# MolTrace CI/CD
#
# This is a monorepo: pnpm/Next.js FE under moltrace_frontend/ and uv/Python
# BE under moltrace_backend/. Both are gated by tests before any production
# target gets a deploy.
#
# Production targets (since the 2026-07 Render → GCP migration):
#   - Vercel              — FE (moltrace.co, www.moltrace.co); deployed by the
#                           `deploy` job's hook below.
#   - GCP Cloud Run (BE)  — backend API (service moltrace-backend, project
#                           moltrace-prod). Deployed by the `deploy-backend`
#                           job: keyless Workload Identity Federation (no
#                           stored SA key) as moltrace-deployer@, then Cloud
#                           Build → migrate job → new Cloud Run revision.
# Cloud SQL (moltrace-db) is NOT a deploy target — on a NEW database the app
# bootstraps its schema at startup (init_db → create_all) and Alembic is then
# stamped; on an existing database migrations run as the one-off Cloud Run job
# `moltrace-migrate` (alembic upgrade head), never in the start command.
#
# Required GitHub Secrets (set under Settings → Secrets and variables →
# Actions → New repository secret):
#   VERCEL_DEPLOY_HOOK       — Vercel "Deploy Hooks" URL for the FE project
#                              (Project Settings → Git → Deploy Hooks)
#
# Required platform toggles (one-time, manual):
#   - Vercel: disable auto-deploy on the connected Git repo (file-based via
#     moltrace_frontend/vercel.json with `git.deploymentEnabled: false`).
#   - Render: set "Auto-Deploy" to "No" on BOTH the moltrace-backend AND the
#     moltrace-frontend1 services.
#
# Without those toggles the platforms will keep deploying every push
# regardless of this workflow's verdict; with them, only commits that pass
# both test jobs reach production.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel an older run on the same ref when a new push lands — avoids racing
# deploys and double-billing minutes.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (Security Prompt 18 — zero-trust CI). Every job inherits a
# read-only GITHUB_TOKEN unless it explicitly scopes up; only `attest` (id-token +
# attestations write, for keyless Sigstore) and `verify-provenance` (attestations
# read) need more. The deploy job only POSTs to external deploy-hook secrets and
# needs no GITHUB_TOKEN write at all.
permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moltrace_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # pnpm must be installed BEFORE setup-node so the cache key can resolve
      # the pnpm store. Version is pinned to match moltrace_frontend/package.json
      # (packageManager: pnpm@11.0.3).
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.0.3

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Matches moltrace_frontend/package.json engines.node (22.14.0).
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: moltrace_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `vitest` (no args) runs once in CI environments per its own CI
      # detection, but `--run` makes the one-shot mode explicit so the job
      # never hangs in interactive mode if the env var is missing.
      - name: Run vitest
        run: pnpm test -- --run

      # The real type gate: next.config.mjs sets `typescript.ignoreBuildErrors`,
      # so neither `pnpm build` nor the Vercel deploy ever typechecks — without
      # this step a type error merges green and surfaces at runtime.
      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      # Prove the production build compiles before anything can deploy it — the
      # deploy hook fires unconditionally after the gates, so a broken build's
      # first signal used to be the Vercel deploy itself.
      - name: Production build
        run: pnpm build

      # Informational bundle baseline (P1 §6): the emitted first-load JS per
      # route, so a dependency that doubles the client bundle is visible in the
      # run artifact. Becomes a blocking budget only after a baseline is agreed
      # (same informational-first policy as docs/security_sdlc_gates.md).
      - name: Report client bundle sizes
        if: always()
        run: |
          {
            echo "### Client bundle (informational baseline)"
            echo '```'
            du -sh .next/static/chunks 2>/dev/null || true
            find .next/static/chunks -name '*.js' -size +150k -exec du -h {} + 2>/dev/null | sort -rh | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backend-tests:
    name: Backend · pytest (shard ${{ matrix.group }}/4)
    runs-on: ubuntu-latest
    # Sharded across 4 parallel runners with pytest-split. GitHub's standard
    # ubuntu-latest is only 2 vCPU, so `-n auto` alone gave a modest speedup and
    # the whole non-slow suite had crept up to ~30 min — right at the ceiling, so
    # it intermittently got KILLED near 90 % (a timed-out job reports as
    # "cancelled", which then skips the gate + deploy). Each shard now runs ~1/4
    # of the collected tests (still `-n auto` within the shard) → ~8 min, and the
    # 30-min backstop only ever fires on a true hang. `fail-fast: false` so one
    # shard's real failure reports on its own instead of cancelling its siblings.
    # NOT coupled to frontend-tests (no `needs:`) — FE and BE run independently.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: moltrace_backend
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # uv manages its own Python install — we pick the version that
          # matches moltrace_backend/Dockerfile's base image.
          python-version: "3.13.5"
          enable-cache: true
          cache-dependency-glob: moltrace_backend/uv.lock

      # The `fid` extra is required for the FID-processing code paths the
      # tests exercise; `dev` brings pytest + httpx. The `infra` extra
      # (mlflow/dvc/great-expectations) is intentionally NOT installed —
      # per the comment in pyproject.toml, adapter tests `pytest.importorskip`
      # those so the always-on native path stays gated by CI.
      - name: Install dependencies
        run: uv sync --frozen --extra fid --extra dev

      # pytest config (testpaths=tests, addopts=-q -m 'not slow') in
      # pyproject.toml already skips the slow marker; pytest-split then divides
      # the collected (non-slow) tests into 4 groups by count and this leg runs
      # only group ${{ matrix.group }}. `-n auto` still fans that group across the
      # runner's cores. pytest-split is pulled in just-in-time via `uv run --with`
      # so the backend's pyproject stays untouched (split-sessions: no BE edits).
      # CI-only: local runs stay serial (`uv run pytest`) for clean debugging.
      - name: Run pytest (shard ${{ matrix.group }}/4)
        run: uv run --with pytest-split pytest -n auto --splits 4 --group ${{ matrix.group }}

  backend-slow-tests:
    name: Backend · slow regression suite (shard ${{ matrix.group }}/4)
    # The heavy FID/GSD validation guards (>30s, marked `slow` and therefore
    # excluded from the per-commit fast lane above). Run on pushes to main only
    # so the regression coverage isn't lost while PRs stay fast. This is an
    # independent signal — a failure turns the run red but does NOT block the
    # deploy hooks. To make it a hard deploy gate, add `backend-slow-tests` to
    # the `deploy` job's `needs:` below.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Sharded across 4 runners with pytest-split, exactly like backend-tests above.
    # The slow set is ~13 min of serial compute (the dense ¹³C FID recovery alone
    # is ~40-65s); unsharded on a 2-vCPU runner it crept past the 30-min ceiling
    # and got KILLED near the end — a timed-out job reports as "cancelled", which
    # skips the gate + deploy. Splitting into 4 groups (~3-4 min each) keeps every
    # shard well under the cap and relieves the per-runner memory pressure that was
    # OOM-killing and restarting xdist workers. `fail-fast: false` so one shard's
    # real failure reports on its own instead of cancelling its siblings.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    # Per-shard backstop. With sharding this only ever fires on a true hang — and
    # the per-test --timeout below surfaces such a hang with a traceback naming the
    # exact test, instead of the whole shard dying silently at the cap (which is
    # what made the earlier unsharded cancellation impossible to diagnose).
    timeout-minutes: 30
    # These slow tests are numerically heavy (scipy least_squares / lmfit /
    # linear_sum_assignment → LAPACK/OpenBLAS). Under pytest-xdist on Linux, N workers
    # each spawning M BLAS/OpenMP threads oversubscribe the runner, and — worse —
    # OpenBLAS initialised before execnet forks a worker can crash in the child. That
    # is exactly the "worker 'gwN' crashed while running ..." failure seen on CI, while
    # the same tests pass on macOS/ARM (different fork/BLAS behaviour). Pin every
    # numerical thread pool to 1 so each worker's BLAS stays single-threaded — xdist
    # already supplies the parallelism, so there is no speed cost — which removes both
    # the oversubscription and the fork crash. PYTHONFAULTHANDLER makes any residual
    # native crash print a C-level traceback (naming the exact call) instead of a bare
    # "worker crashed".
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        working-directory: moltrace_backend
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13.5"
          enable-cache: true
          cache-dependency-glob: moltrace_backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra fid --extra dev

      # pytest-split divides the collected slow set into 4 groups; this leg runs
      # only group ${{ matrix.group }} (still `-n auto` within the shard). Both
      # pytest-split and pytest-timeout are pulled in just-in-time via `uv run
      # --with`, so the backend's pyproject stays untouched (split-sessions: no BE
      # edits). --timeout=600 (thread method, xdist-safe) fails a genuinely hung
      # test with a traceback rather than burning the shard's whole 30-min budget
      # in silence; the heaviest real test is ~65s, so 600s never clips a legit run.
      - name: Run slow tests (shard ${{ matrix.group }}/4)
        run: >-
          uv run --with pytest-split --with pytest-timeout pytest -m slow -n auto
          --splits 4 --group ${{ matrix.group }}
          --timeout=600 --timeout-method=thread

  # ---------------------------------------------------------------------------
  # Raw FID Prompt sidecar diagnostics — ported from the pre-monorepo
  # moltrace_backend/.github/workflows/tests.yml, a location GitHub never
  # executes workflows from, so the four release-evidence artifacts that
  # /admin/release-health advertises as `ci_diagnostic_non_blocking` had never
  # actually been produced by any run. This job is what makes that payload true.
  # Non-blocking by construction: no deploy job `needs` it. One --limit 20 run
  # produces every artifact family; the flags on the advertised per-artifact
  # commands change only the exit verdict, never the files, so the other three
  # directories are fanned out by copy instead of re-running the 20-fixture
  # pipeline three more times.
  raw-fid-sidecar-diagnostics:
    name: Raw FID Prompt sidecar diagnostics (non-blocking release evidence)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: moltrace_backend
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13.5"
          enable-cache: true
          cache-dependency-glob: moltrace_backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra fid --extra dev

      - name: Raw FID Prompt sidecar smoke report
        env:
          PYTHONPATH: src
        run: uv run moltrace-raw-fid-sidecar-report --limit 1 --no-include-varian --quiet --smoke

      - name: Raw FID Prompt manual promotion gate diagnostic
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: >
          uv run moltrace-raw-fid-sidecar-report
          --limit 20
          --include-varian
          --quiet
          --promotion-gate
          --output-dir "$RUNNER_TEMP/raw_fid_prompt_manual_promotion_gate"

      - name: Fan out sidecar report files to the per-artifact directories
        if: always()
        run: |
          SRC="$RUNNER_TEMP/raw_fid_prompt_manual_promotion_gate"
          for d in raw_fid_prompt_provenance_checksums raw_fid_prompt_shadow_comparison raw_fid_prompt_release_readiness; do
            mkdir -p "$RUNNER_TEMP/$d"
            cp "$SRC"/* "$RUNNER_TEMP/$d"/ 2>/dev/null || true
          done

      - name: Upload Raw FID Prompt manual promotion gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-fid-prompt-manual-promotion-gate
          path: ${{ runner.temp }}/raw_fid_prompt_manual_promotion_gate
          if-no-files-found: ignore

      - name: Raw FID Prompt provenance checksum report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-fid-prompt-provenance-checksums
          path: |
            ${{ runner.temp }}/raw_fid_prompt_provenance_checksums/raw_fid_prompt_sidecar_provenance_checksums.json
            ${{ runner.temp }}/raw_fid_prompt_provenance_checksums/raw_fid_prompt_sidecar_provenance_checksums.csv
          if-no-files-found: ignore

      - name: Raw FID Prompt shadow comparison summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-fid-prompt-shadow-comparison
          path: |
            ${{ runner.temp }}/raw_fid_prompt_shadow_comparison/raw_fid_prompt_shadow_comparison_summary.json
            ${{ runner.temp }}/raw_fid_prompt_shadow_comparison/raw_fid_prompt_shadow_comparison_summary.csv
          if-no-files-found: ignore

      - name: Summarize Raw FID Prompt shadow comparison review
        if: always()
        run: |
          {
            echo "### Raw FID Prompt shadow comparison"
            echo ""
            echo "- Artifact: \`raw-fid-prompt-shadow-comparison\`"
            echo "- Files: \`raw_fid_prompt_shadow_comparison_summary.json\`, \`raw_fid_prompt_shadow_comparison_summary.csv\`"
            echo "- Scope: read-only release evidence for Prompt 1/2 sidecar-vs-legacy fixture review."
            echo "- Runtime activation: blocked. A separate manual runtime promotion must be implemented and reviewed before Prompt 1/2 can affect SpectraCheck spectra."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Raw FID Prompt release readiness summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-fid-prompt-release-readiness
          path: ${{ runner.temp }}/raw_fid_prompt_release_readiness/raw_fid_prompt_release_readiness.md
          if-no-files-found: ignore

      - name: Summarize Raw FID Prompt release readiness review
        if: always()
        run: |
          {
            echo "### Raw FID Prompt release readiness"
            echo ""
            echo "- Artifact: \`raw-fid-prompt-release-readiness\`"
            echo "- File: \`raw_fid_prompt_release_readiness.md\`"
            echo "- Scope: one read-only reviewer summary of manual-promotion gate, provenance, and shadow-comparison status."
            echo "- Runtime activation: blocked until a separate manual runtime promotion is implemented and reviewed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize Raw FID Prompt artifact map
        if: always()
        run: |
          {
            echo "### Raw FID Prompt artifact map"
            echo ""
            echo "| Artifact | Open this when | Release decision |"
            echo "| --- | --- | --- |"
            echo "| \`raw-fid-prompt-release-readiness\` | You need the fastest one-page Prompt 1/2 readiness summary. | Reviewer-facing summary only; runtime activation stays blocked. |"
            echo "| \`raw-fid-prompt-shadow-comparison\` | You need sidecar-vs-legacy fixture deltas. | Read-only comparison evidence; do not use it to drive plotted spectra. |"
            echo "| \`raw-fid-prompt-provenance-checksums\` | You need fixture/report hashes for audit trails. | Audit evidence only; investigate hash drift before release. |"
            echo "| \`raw-fid-prompt-manual-promotion-gate\` | You need the detailed manual-promotion gate diagnostics. | May show \`review_required\` without failing CI; \`activation_allowed=false\` must remain in effect. |"
            echo ""
            echo "All four artifacts are diagnostic release evidence. None may activate Prompt 1/2 for SpectraCheck runtime spectra, raw-FID plotting, processed analysis, peak markers, legends, phase correction, or baseline correction."
          } >> "$GITHUB_STEP_SUMMARY"

  # Reviewer guardrails for the diagnostic-artifact / release-health contract —
  # also ported from the dead pre-monorepo workflow. The scripts live at the
  # repo root and are monorepo-aware.
  reviewer-guardrails:
    name: Prompt sidecar + release-health guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13.5"
          enable-cache: true
          cache-dependency-glob: moltrace_backend/uv.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.3

      - name: Install backend dependencies
        working-directory: moltrace_backend
        run: uv sync --frozen --extra dev --extra fid

      - name: Install frontend dependencies
        working-directory: moltrace_frontend
        run: pnpm install --frozen-lockfile

      - name: Run Prompt sidecar guardrail suite
        id: prompt_sidecar_guardrails
        run: scripts/run_prompt_sidecar_guardrails.sh

      - name: Run release-health contract guardrail suite
        id: release_health_guardrails
        run: scripts/run_release_health_contract_guardrails.sh

      - name: Summarize reviewer guardrail workflow
        if: always()
        run: |
          {
            echo "### Reviewer guardrail workflow"
            echo ""
            echo "- Prompt sidecar guardrails: \`${{ steps.prompt_sidecar_guardrails.outcome }}\`"
            echo "- Release-health guardrails: \`${{ steps.release_health_guardrails.outcome }}\`"
            echo ""
            echo "Run locally before merging diagnostic-artifact, release-health, Deployment Settings, CI artifact, or release-checklist changes:"
            echo ""
            echo "\`\`\`bash"
            echo "./scripts/run_prompt_sidecar_guardrails.sh"
            echo "./scripts/run_release_health_contract_guardrails.sh"
            echo "\`\`\`"
            echo ""
            echo "If Prompt sidecar guardrails fail: stop release review until the change is proven metadata-only or a separate manual runtime-promotion phase is opened."
            echo "If release-health guardrails fail: update backend payloads, frontend parsing, Deployment Settings rendering, tests, and docs together."
            echo "If scientific or spectrum-rendering tests fail: fix the owning SpectraCheck regression instead of changing this checklist."
            echo ""
            echo "Passing these guardrails does not activate Prompt 1/2 for runtime spectra."
          } >> "$GITHUB_STEP_SUMMARY"

  desktop-tests:
    name: Desktop · confinement + product config
    # NOT in any deploy job's `needs:`, deliberately. The deploy jobs ship the
    # backend to Cloud Run and the frontend to Vercel; neither ships the desktop.
    # Gating them on a desktop regression would block a backend hotfix on an
    # unrelated failure, which is the wrong coupling.
    #
    # To make this protective, add "Desktop · confinement + product config" as a
    # REQUIRED STATUS CHECK in branch protection. Until that is done this job
    # reports and blocks nothing — the same state `reviewer-guardrails` is in.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: moltrace_desktop
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: moltrace_desktop/package-lock.json

      # Electron's binary is ~100 MB and does not change between runs while the
      # version is pinned, so cache it on the pinned version rather than the lock
      # hash — the lock changes for reasons the binary does not.
      - name: Cache the Electron binary
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-43.4.1

      - name: Install
        run: npm ci

      - name: Electron version is EXACTLY the pin
        # A caret would accept a different Chromium, and the engine identity is
        # what makes the artifact qualifiable (§7.1, §10.2).
        run: |
          actual=$(node -p "require('electron/package.json').version")
          echo "electron: $actual"
          [ "$actual" = "43.4.1" ] || { echo "::error::expected 43.4.1, got $actual"; exit 1; }

      - name: Product config — inert, unbranded, no key material
        run: npm run test:product

      - name: Transport credential
        run: npm run test:credential

      # Electron's SUID sandbox helper ships non-setuid from npm, and Chromium
      # REFUSES TO START rather than run unsandboxed — which is the correct
      # behaviour and is why the first run of this job failed on Linux.
      #
      # The one-line fix everyone reaches for is `--no-sandbox`. Do not: it turns
      # the runner green while disabling the exact control this job asserts.
      # Measured — under `--no-sandbox`, `process.sandboxed` stays true and
      # node:fs stays unreachable, because the switch disables Chromium's
      # PROCESS-level sandbox while the `sandbox` webPreference restricts the
      # renderer's JS context. They are different controls sharing a word. The
      # confinement test now refuses to run under either switch, so this is the
      # only fix that works.
      - name: Configure the Chromium SUID sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          ls -l node_modules/electron/dist/chrome-sandbox

      # The renderer confinement test drives a real Electron window, so Linux
      # needs a virtual display. macOS runners provide one.
      - name: Renderer confinement (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:confinement

      - name: Renderer confinement (macOS)
        if: runner.os == 'macOS'
        run: npm run test:confinement

      # Cheap, and it is the failure this repository has actually had: a commit
      # that references a module it did not add. Static resolution rather than
      # require-and-see, because running main.js outside Electron throws for
      # unrelated reasons and a grep on the runtime error would lie.
      - name: Every local reference is committed
        run: npm run test:modules

  deployment-gate:
    name: Deployment gate · fail-closed release control
    # The Prompt 18 release gate. It `needs` both test suites, so the gate's
    # "test suite is green" check is satisfied by construction — if either suite
    # fails this job is skipped, which cascades to skip `deploy` below. Nothing
    # reaches production without passing evaluation, audit, and validation.
    needs: [frontend-tests, backend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moltrace_backend
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13.5"
          enable-cache: true
          cache-dependency-glob: moltrace_backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra fid --extra dev

      # `--self-check` exits non-zero unless the gate ALLOWS an all-pass candidate
      # and BLOCKS every single-check failure (dominance · audit chain · tests
      # green · gold-set leakage). There are no live model artifacts in CI, so this
      # is the always-on guarantee that the fail-closed release-control machinery
      # stays intact — a regression in the gate logic fails CI before it can ever
      # let a bad model through to production.
      - name: Verify deployment gate fails closed
        run: uv run moltrace-deployment-gate --self-check

      # The Prompt 18 REGULATORY release gate (rule-set / model lifecycle). Same fail-closed
      # contract: `--self-check` exits non-zero unless the gate ALLOWS an all-pass candidate and
      # BLOCKS every single-check failure (Prompt 17 eval gate · current GAMP 5 D11 validation
      # record · Prompt 12 Annex 22 audit chain · tests green). Keeps the regulatory lifecycle
      # gate machinery honest before any rule-set can reach production.
      - name: Verify regulatory compliance-MLOps gate fails closed
        run: uv run python -m moltrace.regulatory.ops --self-check

  # ---------------------------------------------------------------------------
  # Security Prompt 15 — SBOM + SLSA provenance + keyless Sigstore attestation,
  # with a verify-at-deploy gate. Deploy-hook-honest: CI proves and gates the
  # SOURCE + dependency closure (SBOM) at the gated commit and refuses to fire
  # the Vercel/Render deploy hooks unless the attestations verify. It does NOT
  # attest the artifact the platforms rebuild downstream — that build runs
  # outside CI's signing boundary (documented in docs/supply_chain_provenance.md).
  # ---------------------------------------------------------------------------
  sbom-backend:
    name: SBOM · backend (CycloneDX)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moltrace_backend
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13.5"
          enable-cache: true
          cache-dependency-glob: moltrace_backend/uv.lock
      # CycloneDX SBOM straight from uv.lock (no project build needed). NOTE: uv's CycloneDX
      # exporter is a PREVIEW feature and emits spec v1.5 (see docs/supply_chain_provenance.md).
      - name: Generate backend SBOM
        run: uv export --format cyclonedx1.5 --no-emit-project -o sbom-backend.cdx.json
      # Fail-closed if the SBOM isn't well-formed JSON, so a corrupt/empty file can't be attested
      # then "verified" and shipped as a compliance artifact.
      - name: Validate backend SBOM
        run: python3 -c "import json; json.load(open('sbom-backend.cdx.json')); print('backend SBOM is valid JSON')"
      - name: Upload backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-backend
          path: moltrace_backend/sbom-backend.cdx.json
          if-no-files-found: error

  sbom-frontend:
    name: SBOM · frontend (CycloneDX)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moltrace_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.0.3
      # No pnpm dependency cache on purpose: this job generates the SBOM with
      # --lockfile-only and never runs `pnpm install`, so no pnpm store is ever
      # created. With `cache: pnpm`, setup-node's Post-step cache-save fails path
      # validation ("Path(s) specified in the action for caching do(es) not exist")
      # and reddens the whole job even though every SBOM step passes. There is
      # nothing to cache here, so we simply don't enable it.
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0
      # pnpm's built-in SBOM (pnpm >= 11). --lockfile-only avoids a full install; emits CycloneDX 1.7.
      # --silent suppresses pnpm log lines that would otherwise leak into the redirected stdout and
      # corrupt the JSON (pnpm prints some notices to stdout, not stderr).
      - name: Generate frontend SBOM
        run: pnpm sbom --silent --sbom-format cyclonedx --prod --lockfile-only > sbom-frontend.cdx.json
      # Fail-closed if the SBOM isn't well-formed JSON (e.g. a stray log line leaked into stdout).
      - name: Validate frontend SBOM
        run: node -e "JSON.parse(require('fs').readFileSync('sbom-frontend.cdx.json','utf8')); console.log('frontend SBOM is valid JSON')"
      - name: Upload frontend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-frontend
          path: moltrace_frontend/sbom-frontend.cdx.json
          if-no-files-found: error

  attest:
    name: Attest · SLSA provenance (keyless Sigstore)
    needs: [sbom-backend, sbom-frontend]
    # Mint attestations only for release commits (push to main). Fully keyless via Sigstore /
    # Fulcio / Rekor + the Actions OIDC token — no stored key, no external account.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token -> Fulcio short-lived signing cert (keyless)
      attestations: write # persist the SLSA provenance to the repo attestation store
      contents: read
    steps:
      - name: Download backend SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-backend
          path: sbom-artifacts
      - name: Download frontend SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-frontend
          path: sbom-artifacts
      - name: Attest SLSA build provenance for both SBOMs
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: "sbom-artifacts/sbom-backend.cdx.json,sbom-artifacts/sbom-frontend.cdx.json"

  verify-provenance:
    name: Verify provenance · supply-chain gate
    needs: [attest]
    # Separate gating job (NOT an in-deploy step) so a verify failure stops EVERY deploy hook —
    # the deploy job's hook steps use `if: always()`, which a failed in-job step would not block.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download backend SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-backend
          path: sbom-artifacts
      - name: Download frontend SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-frontend
          path: sbom-artifacts
      # Verify the EXACT attested artifacts (same-run download — digests match by construction; no
      # nondeterministic regeneration). Fail-closed: any verification failure blocks the deploy job.
      - name: Verify SLSA provenance for both SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          # Template the repo path off the runtime context so this step survives any future
          # transfer or rename (and so the original sirmcdoe -> org transfer that unblocks the
          # GitHub attestations API on private repos doesn't need a workflow edit).
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for sbom in sbom-backend.cdx.json sbom-frontend.cdx.json; do
            echo "::group::gh attestation verify $sbom"
            gh attestation verify "sbom-artifacts/$sbom" \
              --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/ci-cd.yml"
            echo "::endgroup::"
          done

  deploy-backend:
    name: Deploy · Cloud Run (BE)
    needs: [frontend-tests, backend-tests, deployment-gate, verify-provenance]
    # Fully gated backend deploy (2026-07 Render → GCP migration): keyless auth
    # via Workload Identity Federation — the GitHub OIDC token is exchanged for
    # moltrace-deployer@ credentials, no stored service-account key anywhere
    # (same principle as the Sigstore/SLSA supply chain above). Sequence:
    # Cloud Build builds+pushes the image, the moltrace-migrate job applies
    # Alembic deltas (the DB is stamped, so `upgrade head` is correct for every
    # release after the bootstrap), then the service gets the new revision.
    # `gcloud run deploy --image` preserves the service's env/secrets/VPC
    # config — only the image changes here; config changes stay in the
    # deploy runbook (moltrace_backend/deploy/README.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token -> WIF exchange (keyless)
    env:
      IMAGE: us-central1-docker.pkg.dev/moltrace-prod/moltrace/backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/304031104668/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: moltrace-deployer@moltrace-prod.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Stage HOSE knowledge base (gitignored; fetched from GCS)
        working-directory: moltrace_backend
        # The NMRShiftDB2-derived table is gitignored (CC BY-SA derivative), so a
        # clean checkout builds an image whose predictor falls back to the
        # 16-molecule seed (~35 ppm median 13C uncertainty vs ~1.88 ppm with the
        # full index). Fetch the artifact and verify it against the tracked
        # checksum so the deploy fails closed instead of shipping the degraded
        # predictor — the Dockerfile's REQUIRE_HOSE_KB guard is the backstop.
        # Publishing a new table = upload to GCS + update the tracked .sha256.
        run: |
          gcloud storage cp \
            gs://moltrace-model-weights/hose/hose_index.json.gz \
            data/hose/hose_index.json.gz
          (cd data/hose && sha256sum -c hose_index.json.gz.sha256)
      - name: Setup uv (accuracy gate)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13.5"
          enable-cache: true
          cache-dependency-glob: moltrace_backend/uv.lock
      # Accuracy regression sentinel (informational first, per the
      # security_sdlc_gates policy): score the production verify/predict path on
      # the frozen fixture gold set against the committed incumbent vector.
      # Runs AFTER the KB staging step above so candidate and incumbent share
      # knowledge-base provenance — the gate refuses cross-KB comparisons.
      # Before flipping to blocking (drop --informational): re-mint the
      # incumbent from a CI run of this step's artifact so latency percentiles
      # reflect CI hardware, and review it.
      - name: Accuracy regression sentinel (informational)
        working-directory: moltrace_backend
        env:
          MOLTRACE_HOSE_KB: ${{ github.workspace }}/moltrace_backend/data/hose/hose_index.json.gz
        run: |
          uv sync --frozen --extra fid --extra dev
          uv run moltrace-eval-gate --informational \
            --persist-out "$RUNNER_TEMP/nmr_eval_gate/candidate_metric_vector.json"
      - name: Upload accuracy sentinel vector
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmr-eval-gate-candidate-vector
          path: ${{ runner.temp }}/nmr_eval_gate/candidate_metric_vector.json
          if-no-files-found: ignore
      - name: Build + push image (Cloud Build)
        working-directory: moltrace_backend
        run: |
          gcloud builds submit --config cloudbuild.yaml \
            --substitutions=_TAG="${{ github.sha }}",_GIT_SHA="${{ github.sha }}" --project moltrace-prod
      - name: Apply DB migrations (Cloud Run job)
        run: |
          gcloud run jobs update moltrace-migrate --image "$IMAGE" \
            --command alembic --args upgrade,head \
            --region us-central1 --project moltrace-prod
          gcloud run jobs execute moltrace-migrate \
            --region us-central1 --project moltrace-prod --wait
      - name: Deploy new revision
        run: |
          gcloud run deploy moltrace-backend --image "$IMAGE" \
            --region us-central1 --project moltrace-prod

  deploy:
    name: Deploy · Vercel (FE)
    needs: [frontend-tests, backend-tests, deployment-gate, verify-provenance]
    # Only deploy when both gates passed on a direct push to main (not PRs,
    # not manual reruns of feature branches).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook (FE)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        # `--fail` so a 4xx/5xx fails the step (deploy hooks return 201 on
        # success). `-sS` keeps output quiet but still surfaces errors. The
        # URL is interpolated from the env var so it never appears in
        # workflow logs even when --fail prints a diagnostic.
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set"; exit 1
          fi
          curl -sS --fail -X POST "$HOOK"
